[package]
name = "sttd"
version = "0.1.0"
edition = "2021"
description = "Real-time Speech-to-Text pipeline: cpal + resampler + deep_filter + earshot + parakeet"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
cpal = "0.15"
daemonize = "0.5"
libc = "0.2"
resampler = "0.5"
biquad = "0.6"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# parakeet_core's ndarray: must match `ort`'s own ndarray (0.17), otherwise
# `TensorRef::from_array_view` types mismatch. Renamed because `denoise`
# needs 0.15 for `deep_filter`.
ndarray17 = { package = "ndarray", version = "0.17" }
earshot = { version = "1.2", features = ["alloc"] }
# Parakeet engine (see src/parakeet.rs + src/parakeet_core/): direct `ort`
# sessions (vendored Murmure decoder) + Rust mel frontend (from
# `parakeet-rs`). Default features pull in `ort`'s `download-binaries`, so
# the ONNX Runtime native library is fetched at build time. Note: `ort` logs
# `log`; without a tracing subscriber installed those messages are simply
# dropped, which is fine here.
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
regex = "1"
once_cell = "1"
realfft = "3"
thiserror = "2"
rtrb = "0.4"
num_cpus = "1.17"
ureq = "2"
anyhow = "1"
ctrlc = "3"
hound = "3.5"
signal-hook = { version = "0.3", features = ["iterator"] }

[features]
default = []
denoise = ["dep:deep_filter", "dep:ndarray"]

[profile.release]
strip = true
# lto = true
