[package]
name = "sttd"
version = "0.1.0"
edition = "2021"
description = "Real-time Speech-to-Text pipeline: cpal + resampler + deep_filter + earshot + whisper-rs"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
cpal = "0.15"
daemonize = "0.5"
libc = "0.2"
resampler = "0.5"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
earshot = { version = "1.2", features = ["alloc"] }
whisper-rs = { version = "0.13", features = ["cuda", "whisper-cpp-log"] }
crossbeam-channel = "0.5"
ureq = "2"
anyhow = "1"
ctrlc = "3"
signal-hook = { version = "0.3", features = ["iterator"] }
