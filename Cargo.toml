[package]
name = "sttd"
version = "0.1.0"
edition = "2021"
description = "Real-time Speech-to-Text pipeline: cpal + resampler + deep_filter + earshot + parakeet (+ whisper-rs with the `whisper` feature, + sherpa-onnx with the `sherpa` feature)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
cpal = "0.15"
daemonize = "0.5"
libc = "0.2"
resampler = "0.5"
biquad = "0.6"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
earshot = { version = "1.2", features = ["alloc"] }
whisper-rs = { version = "0.13", features = ["cuda", "whisper-cpp-log"], optional = true }
# Second ASR engine (see src/parakeet.rs). Default features (cpu +
# ort-defaults + api-28) pull in `ort`'s `download-binaries`, so the ONNX
# Runtime native library is fetched by the build script the same way
# whisper.cpp is compiled in — no cmake, no interaction with the CUDA
# knobs in .cargo/config.toml (those are ggml-specific). Note: `ort` logs
# through `tracing`, not `log`; without a tracing subscriber installed
# those messages are simply dropped, which is fine here.
parakeet-rs = "0.3"
# Third ASR engine family (see src/sherpa.rs). Shared-link mode: the build
# script downloads a matching prebuilt sherpa-onnx archive from GitHub
# releases and wires rpath automatically. Shared (not static) is required:
# `ort` (via parakeet-rs) already statically links its own onnxruntime
# core, and two static onnxruntime cores in one binary fail the link as
# soon as the `whisper` feature's objects join (duplicate protobuf/onnx
# symbols) — the shared lib keeps sherpa's copy out of the static link.
# Only built with the `sherpa` feature so the default build stays lean.
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"], optional = true }
rtrb = "0.4"
num_cpus = "1.17"
ureq = "2"
anyhow = "1"
ctrlc = "3"
hound = "3.5"
signal-hook = { version = "0.3", features = ["iterator"] }

[features]
default = []
denoise = ["dep:deep_filter", "dep:ndarray"]
# Whisper engine (see src/whisper.rs). Off by default: the default model is
# Parakeet, and enabling this pulls in the whisper.cpp build (cmake + CUDA
# knobs in .cargo/config.toml). When disabled, whisper specs/paths are
# rejected and whisper-only CLI flags disappear from `--help`.
whisper = ["dep:whisper-rs"]
# CUDA execution for Parakeet (see src/parakeet.rs). Off by default: the
# prebuilt ORT CUDA EP targets older CUDA/cuDNN than the CUDA 13.4/sm_120
# toolchain whisper.cpp is built against here, so it may not load; CPU
# stays the safe default and the loader falls back to it if CUDA fails.
parakeet-cuda = ["parakeet-rs/cuda"]
# Sherpa-onnx engine family (see src/sherpa.rs): offline Nemo-transducer
# (Parakeet-TDT-v3), Canary-1B-v2 (Sarphix int8 export of nvidia/canary-1b-v2,
# `sherpa-canary-1b-v2-int8` — Polish needs a native lib newer than 1.13.8,
# see `SherpaKind`) plus VAD-driven simulated streaming where sherpa's
# Silero VAD owns the cuts. Off by default: pulls the prebuilt sherpa-onnx
# native lib at compile time and ~640 MiB–1.4 GiB of weights at first run.
# Coexists with `parakeet-rs` (untouched default).
sherpa = ["dep:sherpa-onnx"]

[profile.release]
strip = true
lto = true
