[package]
name = "sttctl"
version = "0.1.0"
edition = "2021"
description = "Control sttd daemon via D-Bus"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
